services:
  healthwatch:
    build: .
    ports:
      - "8000:8000"
    environment:
      TARGETS: "https://example.com,https://github.com,https://httpstat.us/503"
      CHECK_INTERVAL_SECONDS: "15"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - healthwatch
    restart: unless-stopped
